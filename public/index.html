<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Portfólio</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-[#0b0b0f] text-white font-sans">

  <!-- Botões fixos no topo (não rolam com a página) -->
  <div id="topFixedButtons" class="top-fixed-buttons"></div>

  <main class="mx-auto max-w-6xl px-3 pb-28 sm:px-6">

    <div class="top-bg">
    <div class="top-bg-media" id="topBgMedia">
      <img src="img/foto-perfil.png" alt="" />
    </div>
    <section class="flex min-h-[250px] flex-col items-center gap-4 pt-20 text-center">
      <div class="flex w-full max-w-2xl items-start gap-4 text-left">
        <img
          id="heroProfilePhoto"
          src="img/foto-perfil.png"
          alt="Foto de perfil"
          class="h-16 w-16 shrink-0 rounded-full object-cover ring-2 ring-white/10 sm:h-20 sm:w-20"
        />
        <div class="flex flex-col pt-1">
          <h2 class="gradient-text text-2xl font-black leading-tight tracking-tight sm:text-3xl">
            <span id="heroTitleLine1">Mateus Alves,</span> <span id="heroTitleLine2">27 anos.</span>
          </h2>
          <p id="heroSubtitle" class="intro-text mt-1 max-w-md text-sm leading-snug sm:text-base">
            Editor de Vídeos, Social Média, Filmaker e Programador.
          </p>
        </div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-ico"></i>
          <input
            id="searchInput"
            type="text"
            autocomplete="off"
            placeholder="o que você precisa saber?"
            class="search-input"
          >
          <button id="searchBtn" type="button" class="search-btn">
            <span class="search-btn-inner">
              <i class="fa-solid fa-magnifying-glass search-btn-ico"></i>
              <span class="search-btn-rings">
                <span></span><span></span><span></span>
              </span>
            </span>
            <span class="search-btn-label">Pesquisar</span>
          </button>
        </div>
        <div class="search-suggestions" id="searchSuggestions"></div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </section>

    <!-- CARDS ESTILO PASTA -->
    <section class="mt-2">

      <div id="portfolioArea">
        <div
          id="portfolioGrid"
          class="grid grid-cols-2 gap-x-4 gap-y-6 sm:gap-x-6 sm:gap-y-8 lg:gap-y-10"
        ></div>

        <!-- PAINEL EXPANDIDO (overlay absoluto) -->
        <div id="folderPanel"></div>
      </div>
    </section>
    </div>

    <!-- GRID 4x3 ABAIXO DOS CARDS -->
    <section class="mt-8">
      <span class="section-hint"><i class="fa-solid fa-table-cells"></i> Aba</span>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="todas">Todas</button>
        <button class="filter-btn" data-popup-titulo="Filmagens">Filmagens</button>
        <button class="filter-btn" data-popup-titulo="Top Vídeos">Top Edições</button>
        <button class="filter-btn" data-popup-titulo="Artes">Artes</button>
        <button class="filter-btn" data-popup-titulo="Narrações">Narrações</button>
      </div>

      <div
        id="photoGrid"
        class="mx-auto grid w-full grid-cols-2 gap-2 sm:grid-cols-3 sm:gap-3 md:gap-4 lg:grid-cols-4"
      ></div>

      <div class="mt-8 mb-24 flex justify-center">
        <button id="mostrarMais" type="button" class="show-more-btn">
          Mostrar mais
        </button>
      </div>
    </section>

  </main>

  <!-- OVERLAY MENU SOCIAL -->
  <div id="socialOverlay"></div>

  <!-- ÍCONES FLUTUANTES -->
  <div id="floatContainer" class="fixed bottom-7 left-7 z-[60]">

    <div id="fi-instagram" class="float-item">
      <button class="fi-btn bg-gradient-to-tr from-purple-600 via-pink-500 to-orange-400 text-white">
        <i class="fa-brands fa-instagram"></i>
      </button>
      <span class="contact-tag">@mateusalvesdzn</span>
    </div>

    <div id="fi-linkedin" class="float-item">
      <button class="fi-btn bg-[#0A66C2] text-white">
        <i class="fa-brands fa-linkedin-in"></i>
      </button>
      <span class="contact-tag">Mateus Alves</span>
    </div>

    <div id="fi-gmail" class="float-item">
      <button class="fi-btn bg-white text-[#EA4335]">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <span class="contact-tag">mateusalves.flu@gmail.com</span>
    </div>

    <div id="fi-facebook" class="float-item">
      <button class="fi-btn bg-[#1877F2] text-white">
        <i class="fa-brands fa-facebook-f"></i>
      </button>
      <span class="contact-tag">Mateus Alves</span>
    </div>

    <div id="fi-whatsapp" class="float-item">
      <button id="socialToggle" class="fi-btn bg-[#25D366] text-white" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </button>
      <span class="contact-tag">21973042881</span>
    </div>

  </div>

  <!--
    Base pública do Vercel Blob usado pelo painel admin (admin/).
    Preenchido após o primeiro deploy do admin — até lá, o site funciona
    normalmente ignorando o conteúdo/mídia adicionados por lá.
  -->
  <script>window.ADMIN_BLOB_BASE = "https://dbt8fnpuzx1hypkf.public.blob.vercel-storage.com";</script>

  <script>
    // cache-busting: forca browser buscar JS fresco a cada load (mata cache)
    (function () {
      var v = Date.now();

      function loadScript(src) {
        return new Promise(function (resolve) {
          var s = document.createElement("script");
          s.src = src + (src.indexOf("?") === -1 ? "?v=" + v : "&v=" + v);
          s.onload = resolve;
          s.onerror = resolve;
          document.body.appendChild(s);
        });
      }

      function mergeManifest(extra) {
        // O painel admin manda: uma vez que ele gerencia uma pasta, ela substitui
        // (não soma) a lista estática, permitindo apagar/reordenar itens antigos.
        window.MEDIA_MANIFEST = window.MEDIA_MANIFEST || { files: {}, subdirs: {} };
        var files = window.MEDIA_MANIFEST.files;
        var subdirs = window.MEDIA_MANIFEST.subdirs;
        Object.keys(extra.files || {}).forEach(function (dir) {
          files[dir] = extra.files[dir];
        });
        Object.keys(extra.subdirs || {}).forEach(function (dir) {
          var existing = subdirs[dir] || [];
          extra.subdirs[dir].forEach(function (sub) {
            if (existing.indexOf(sub) === -1) existing.push(sub);
          });
          subdirs[dir] = existing;
        });
      }

      function applyContent(c) {
        if (c.siteTitle) document.title = c.siteTitle;

        var l1 = document.getElementById("heroTitleLine1");
        var l2 = document.getElementById("heroTitleLine2");
        var sub = document.getElementById("heroSubtitle");
        var searchInput = document.getElementById("searchInput");
        var searchLabel = document.querySelector(".search-btn-label");
        var showMore = document.getElementById("mostrarMais");

        if (l1 && c.heroTitleLine1) l1.textContent = c.heroTitleLine1;
        if (l2 && c.heroTitleLine2) l2.textContent = c.heroTitleLine2;
        if (sub && c.heroSubtitle) sub.textContent = c.heroSubtitle;
        if (searchInput && c.searchPlaceholder) searchInput.placeholder = c.searchPlaceholder;
        if (searchLabel && c.searchButtonLabel) searchLabel.textContent = c.searchButtonLabel;
        if (showMore && c.showMoreLabel) showMore.textContent = c.showMoreLabel;

        var map = {
          "fi-instagram": c.instagramHandle,
          "fi-linkedin": c.linkedinName,
          "fi-gmail": c.email,
          "fi-facebook": c.facebookName,
          "fi-whatsapp": c.whatsappNumber
        };
        Object.keys(map).forEach(function (id) {
          if (!map[id]) return;
          var el = document.querySelector("#" + id + " .contact-tag");
          if (el) el.textContent = map[id];
        });
      }

      function applyBio(bio) {
        if (!bio) return;
        window.ADMIN_BIO = bio;
        if (bio.imagem) {
          var heroPhoto = document.getElementById("heroProfilePhoto");
          if (heroPhoto) heroPhoto.src = bio.imagem;
        }
      }

      function applyBioToSearchData() {
        var bio = window.ADMIN_BIO;
        if (!bio || !Array.isArray(window.SEARCH_DATA)) return;
        var item = window.SEARCH_DATA.find(function (it) {
          return it.titulo === "Quem é Mateus Alves?";
        });
        if (!item) return;
        item.conteudo = item.conteudo || {};
        if (bio.markdown) item.conteudo.markdown = bio.markdown;
        if (bio.imagem) item.conteudo.imagens = [bio.imagem];
        if (bio.botaoLabel && bio.botaoUrl) {
          item.conteudo.botoes = [
            { label: bio.botaoLabel, url: bio.botaoUrl, icone: "fa-brands fa-instagram", cor: "#e1306c" }
          ];
        }
      }

      function applyPortfolioCards(data) {
        // lista vazia salva de propósito também é respeitada (remove os cards)
        if (data && Array.isArray(data.cards)) {
          window.ADMIN_PORTFOLIO_CARDS = data.cards;
        }
      }

      function applyBackground(bg) {
        if (!bg || !bg.url) return;
        var container = document.getElementById("topBgMedia");
        if (!container) return;
        container.innerHTML = "";
        var el;
        if (bg.type === "video") {
          el = document.createElement("video");
          el.src = bg.url;
          el.autoplay = true;
          el.muted = true;
          el.loop = true;
          el.playsInline = true;
        } else {
          el = document.createElement("img");
          el.src = bg.url;
          el.alt = "";
        }
        container.appendChild(el);
      }

      async function fetchAdminData() {
        var base = window.ADMIN_BLOB_BASE;
        if (!base) return;
        try {
          var mRes = await fetch(base + "/manifest/admin-manifest.json", { cache: "no-store" });
          if (mRes.ok) mergeManifest(await mRes.json());
        } catch (e) {}
        try {
          var cRes = await fetch(base + "/content/site-content.json", { cache: "no-store" });
          if (cRes.ok) applyContent(await cRes.json());
        } catch (e) {}
        try {
          var bRes = await fetch(base + "/content/bio.json", { cache: "no-store" });
          if (bRes.ok) applyBio(await bRes.json());
        } catch (e) {}
        try {
          var pRes = await fetch(base + "/content/portfolio-cards.json", { cache: "no-store" });
          if (pRes.ok) applyPortfolioCards(await pRes.json());
        } catch (e) {}
        try {
          var bgRes = await fetch(base + "/content/background.json", { cache: "no-store" });
          if (bgRes.ok) applyBackground(await bgRes.json());
        } catch (e) {}
      }

      (async function () {
        await loadScript("media-manifest.js");
        await fetchAdminData();
        await loadScript("search/search-data.js");
        applyBioToSearchData();
        await loadScript("search/search-suggestions.js");
        await loadScript("script.js");
      })();
    })();
  </script>

</body>
</html>
